    '<p class="nota">No app instalado na tela de início, copie o link de convite e cole aqui:</p>' +
    '<input id="convite" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://…#t=…">' +
    '<p class="nota" id="conviteErro" hidden></p>' +
    '<button type="button" class="primario" id="entrar">Entrar</button></div>';
  $('#entrar').onclick = () => {
    const c = lerConvite($('#convite').value);
    const erro = $('#conviteErro');
    if (!c.token || (!c.api && !apiUrl())) {
      erro.textContent = c.token ? 'O link não traz o endereço do servidor (api=…).' : 'Link inválido: falta o trecho #t=…';
      erro.hidden = false;
      return;
    }
    aplicarConvite(c);
    render();
    atualizar();
  };
}

function renderCarregando() {
  raiz.innerHTML = '<div class="tela"><h1>Despesas da Viagem</h1><p class="nota">' +
    (rede === 'offline' ? 'Sem conexão. Conecte-se uma vez para carregar a viagem.'
      : rede === 'erro' ? esc(erroRede) : 'Carregando…') + '</p>' +
    (rede === 'offline' || rede === 'erro' ? '<button type="button" id="tentar">Tentar de novo</button>' : '') + '</div>';
  const b = $('#tentar');
  if (b) b.onclick = () => atualizar();
}

function renderEscolherNome() {
  raiz.innerHTML = '<div class="tela"><h1>' + esc(estado.nome_viagem || 'Despesas da Viagem') + '</h1>' +
    '<p class="nota">Quem é você? O nome fica registrado nos lançamentos que você fizer.</p>' +
    '<div class="lista-nomes">' + participantes().map((n) =>
      '<button type="button" data-nome="' + esc(n) + '">' + esc(n) + '</button>').join('') + '</div></div>';
  $('.lista-nomes').onclick = (ev) => {
    const b = ev.target.closest('[data-nome]');
    if (!b) return;
    gravar(LS.eu, b.dataset.nome);
    render();
  };
}

/** Linha de valor (direita): o principal e, abaixo, o complemento (fontes ou quanto foi quitado). */
function valoresItem(l) {
  const v = Number(l.valor);
  if (l.tipo === 'acerto_cruzado') {
    return { valor: dinheiro(Number(l.valor_pago), l.moeda_paga), sub: 'quitou ' + dinheiro(v, l.moeda) };
  }
  const fontes = l.tipo === 'despesa' ? lerFontes(l.fontes) : [];
  return {
    valor: dinheiro(v, l.moeda),
    sub: fontes.length ? 'pago com ' + fontes.map((f) => dinheiro(f.valor, f.moeda)).join(' + ') : '',
  };
}

function itemHtml(l) {
  const parts = lista(l.participantes);
  const despesa = l.tipo === 'despesa';
  let titulo, sub;
  if (despesa) {
    const cat = maiuscula(l.categoria);
    const repete = cat && l.descricao.trim().toLowerCase() === l.categoria.toLowerCase();
    titulo = l.descricao
      ? esc(l.descricao) + (cat && !repete ? '<span class="item-cat"> – ' + esc(cat) + '</span>' : '')
      : esc(cat || 'Despesa');
    sub = esc(l.pagador) + ' pagou para ' + esc(textoParaQuem(l.pagador, parts, participantes(), l.pesos));
  } else {
    // Pagamento e acerto cruzado: ressarcimento de quem pagou para quem recebeu.
    titulo = esc(l.pagador) + ' pagou ' + esc(parts[0] || '');
    sub = esc(l.descricao);
  }
  const etiquetas = [];
  if (l.status === 'pendente') etiquetas.push('<span class="etiqueta pendente">pendente</span>');
  if (l._erro) etiquetas.push('<span class="etiqueta erro">erro ao sincronizar</span>');
  else if (l._local) etiquetas.push('<span class="etiqueta local">não sincronizado</span>');
  const esq = [sub].concat(etiquetas).filter(Boolean).join(' ');
  const vs = valoresItem(l);
  return '<button type="button" class="item' + (despesa ? '' : ' repasse') + '" data-id="' + esc(l.id) + '">' +
    '<span class="item-linha"><span class="item-titulo">' + titulo + '</span>' +
      '<span class="item-valor">' + esc(vs.valor) + '</span></span>' +
    (esq || vs.sub ? '<span class="item-linha"><span class="item-sub">' + esq + '</span>' +
      (vs.sub ? '<span class="item-sub dir">' + esc(vs.sub) + '</span>' : '') + '</span>' : '') +
    '</button>';
}

function renderLista() {
  let ls = lancamentosVisiveis();
  if (filtroPendentes) ls = ls.filter((l) => l.status === 'pendente');
  if (!ls.length) {
    return '<p class="vazio">' + (filtroPendentes ? 'Nenhum lançamento pendente.' : 'Nenhum lançamento ainda. Toque em “+ Nova despesa”.') + '</p>';
  }
  let html = filtroPendentes ? '<button type="button" class="primario largo" id="btnLote">Confirmar pendentes</button>' : '';
  let dia = null;
  ls.forEach((l) => {
    if (l.data !== dia) {
      if (dia !== null) html += '</div>';
      dia = l.data;
      html += '<div class="dia">' + esc(dataCurta(dia)) + '</div><div class="grupo">';
    }
    html += itemHtml(l);
  });
  return html + '</div>';
}

/** Uma dívida: nomes à esquerda e um botão por moeda, que abre o pagamento já preenchido. */
function dividaHtml(de, para, valores) {
  return '<div class="divida"><span class="divida-nomes">' + esc(deve(de, para)) + '</span><span class="divida-valores">' +
    Object.keys(valores).map((m) => '<button type="button" class="pilula" data-pagar="' +
      esc(JSON.stringify({ de: de, para: para, moeda: m, valor: valores[m] })) + '">' + esc(dinheiro(valores[m], m)) + '</button>').join('') +
    '</span></div>';
}

function deve(de, para) { return de + ' deve a ' + para; }

function renderAcerto() {
  const tpm = estado.transferencias_por_moeda || {};
  const comDivida = Object.keys(tpm).filter((m) => tpm[m].length);
  // Com uma só moeda as duas visões são iguais: sem alternador.
  const visao = comDivida.length > 1 ? ler(LS.visao, 'moeda') : 'moeda';
  let html = '';
  if (visao === 'par') {
    const pares = estado.por_par || [];
    if (pares.length) html = '<div class="cartao">' + pares.map((p) => dividaHtml(p.de, p.para, p.valores)).join('') + '</div>';
  } else {
    comDivida.forEach((m) => {
      html += '<div class="cartao">' + (comDivida.length > 1 ? '<h3>Em ' + esc(rotuloMoeda(m)) + '</h3>' : '') +
        tpm[m].map((t) => dividaHtml(t.de, t.para, { [m]: t.valor })).join('') + '</div>';
    });
  }
  html = html ? '<p class="dica">Toque numa dívida para registrar o pagamento.</p>' + html
    : '<p class="vazio">Ninguém deve nada a ninguém.</p>';

  const spm = estado.saldos_por_moeda || {};
  const ms = Object.keys(spm);
  let saldos = '';
  if (ms.length) {
    saldos = '<details><summary>Saldos por pessoa</summary><table class="saldos"><thead><tr><th>Pessoa</th>' +
      ms.map((m) => '<th>' + esc(rotuloMoeda(m)) + '</th>').join('') + '</tr></thead><tbody>' +
      participantes().map((n) => '<tr><td>' + esc(n) + '</td>' + ms.map((m) => {
        const v = spm[m][n] || 0;
        return '<td class="' + (v > 0 ? 'pos' : v < 0 ? 'neg' : '') + '">' + esc(formatarNumero(v, casas(m))) + '</td>';
      }).join('') + '</tr>').join('') +
      '</tbody></table><p class="dica">Positivo = tem a receber. Cada moeda é um livro separado.</p></details>';
  }
  const naoSinc = fila.filter((it) => it.acao !== 'moeda').length;
  return (comDivida.length > 1 ? '<div class="segmentado" role="group" aria-label="Visão">' +
      '<button type="button" data-visao="moeda" aria-pressed="' + (visao !== 'par') + '">Por moeda</button>' +
      '<button type="button" data-visao="par" aria-pressed="' + (visao === 'par') + '">Por par</button>' +
    '</div>' : '') +
    (naoSinc ? '<p class="nota">Ainda não inclui ' + (naoSinc > 1 ? naoSinc + ' lançamentos não sincronizados' : '1 lançamento não sincronizado') + '.</p>' : '') +
    html + saldos;
}

/** Indicador discreto de sincronização: {classe, texto, rotulo acessível}. */
function estadoSync() {
  const comErro = fila.filter((it) => it.erro).length;
  if (comErro) return { classe: 'falha', texto: comErro + ' com erro', rotulo: 'Lançamentos com erro de sincronização. Toque para ver.' };
  if (rede === 'sincronizando') return { classe: 'ocupado', texto: fila.length ? 'enviando ' + fila.length : 'atualizando', rotulo: 'Sincronizando' };
  if (fila.length) return { classe: 'aviso', texto: fila.length + ' na fila', rotulo: fila.length + ' não sincronizado(s). Toque para ver.' };
  if (rede === 'offline') return { classe: 'aviso', texto: 'offline', rotulo: 'Sem conexão. Toque para tentar de novo.' };
  if (rede === 'erro') return { classe: 'falha', texto: 'erro', rotulo: 'Erro: ' + erroRede + '. Toque para tentar de novo.' };
  const hora = estado.atualizado_em
    ? new Date(estado.atualizado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
  return { classe: '', texto: hora, rotulo: 'Atualizado às ' + hora + '. Toque para atualizar.' };
}

function renderPrincipal() {
  const totais = estado.totais_por_moeda || {};
  const txtTotais = Object.keys(totais).map((m) => dinheiro(totais[m], m, { semDecimais: true })).join(' · ');
  const pend = lancamentosVisiveis().filter((l) => l.status === 'pendente').length;
  if (!pend) filtroPendentes = false;
  const sync = estadoSync();

  const detalhes = document.querySelector('details');
  const detalhesAberto = detalhes && detalhes.open;
  const rolagem = window.scrollY;

  raiz.innerHTML =
    '<header class="topo">' +
      '<div class="topo-linha"><h1>' + esc(estado.nome_viagem || 'Despesas da Viagem') + '</h1>' +
      '<button type="button" class="sync ' + sync.classe + '" id="btnSync" aria-label="' + esc(sync.rotulo) + '">' + esc(sync.texto) + '</button>' +
      '<button type="button" class="icone" id="btnMenu" aria-label="Menu">☰</button></div>' +
      '<div class="totais" aria-label="Total desembolsado por moeda">' + (txtTotais ? esc(txtTotais) : '—') + '</div>' +
    '</header>' +
    '<main>' +
      ((estado.invalidos || []).length ? '<div class="aviso-caixa">' + estado.invalidos.length +
        ' linha(s) da planilha com erro foram ignoradas no cálculo. Veja a aba Resumo.</div>' : '') +
      '<section class="bloco"><h2>Lançamentos<span class="espaco"></span>' +
        (pend ? '<button type="button" class="selo' + (filtroPendentes ? ' ativo' : '') + '" id="seloPend" aria-pressed="' + filtroPendentes + '">' +
          pend + ' pendente' + (pend > 1 ? 's' : '') + '</button>' : '') +
      '</h2>' + renderLista() + '</section>' +
      '<section class="bloco" id="blocoAcerto"><h2>Acerto de contas</h2>' + renderAcerto() + '</section>' +
    '</main>' +
    '<button type="button" class="primario fab" id="fab">+ Nova despesa</button>';

  if (detalhesAberto) { const d = document.querySelector('details'); if (d) d.open = true; }
  window.scrollTo(0, rolagem);
}

// Delegação de eventos da tela principal
raiz.addEventListener('click', (ev) => {
  const t = ev.target;
  if (t.closest('#fab')) return abrirDespesa();
  if (t.closest('#btnMenu')) return abrirMenu();
  if (t.closest('#btnSync')) return fila.length ? abrirFila() : atualizar();
  if (t.closest('#seloPend')) { filtroPendentes = !filtroPendentes; return render(); }
  if (t.closest('#btnLote')) return abrirConfirmarPendentes();
  const visao = t.closest('[data-visao]');
  if (visao) { gravar(LS.visao, visao.dataset.visao); return render(); }
  const divida = t.closest('.divida');
  if (divida) {
    // Toque no valor abre aquela moeda; toque na linha abre se a dívida tiver uma moeda só.
    const valores = $$('[data-pagar]', divida);
    const alvo = t.closest('[data-pagar]') || (valores.length === 1 ? valores[0] : null);
    if (alvo) abrirPagamento(null, JSON.parse(alvo.dataset.pagar));
    return;
  }
  const item = t.closest('.item');
  if (item) {
    const l = lancamentosVisiveis().find((x) => x.id === item.dataset.id);
    if (!l) return;
    if (l.tipo === 'despesa') abrirDespesa(l);
    else if (l.tipo === 'pagamento') abrirPagamento(l);
    else abrirAcerto(l);
  }
});

// ---------------------------------------------------------------------------
// Inicialização

function aplicarConvite(c) {
  if (c.token) {
    if (c.token !== token()) { gravar(LS.estado, null); estado = null; }
    gravar(LS.token, c.token);
  }
  if (c.api) gravar(LS.api, c.api);
}

function lerFragmento() {
  if (!location.hash) return;
  const c = lerConvite(location.hash);
  aplicarConvite(c);
  if (c.token || c.api) history.replaceState(null, '', location.pathname + location.search);
}

lerFragmento();
render();
if (token() && apiUrl()) atualizar();
window.addEventListener('online', () => atualizar());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && token() && apiUrl()) atualizar();
});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
